<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bandera de México - RGB</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Archivo CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-5">

        <!-- Título -->
        <div class="text-center mb-4">
            <h1>🇲🇽 Bandera de México</h1>
            <p class="text-muted">
                Manipula los colores de la bandera mediante RGB
            </p>
        </div>


        <!-- =========================
             BANDERA
        ========================== -->

        <div class="flag-container">

            <!-- Franja verde -->
            <div id="greenFlag" class="flag green"></div>

            <!-- Franja blanca -->
            <div class="flag white">

                <!-- Escudo sencillo -->
                <div class="shield">

                    <div class="eagle">
                        🦅
                    </div>

                    <div class="snake">
                        🐍
                    </div>

                </div>

            </div>

            <!-- Franja roja -->
            <div id="redFlag" class="flag red"></div>

        </div>


        <!-- =========================
             CONTROLES
        ========================== -->

        <div class="row g-4 mt-4">

            <!-- COLOR VERDE -->
            <div class="col-md-6">

                <div class="card shadow-sm">

                    <div class="card-body">

                        <h3 class="text-center">
                            Color Verde
                        </h3>

                        <!-- Selector -->
                        <div class="text-center my-3">

                            <input
                                type="color"
                                id="greenPicker"
                                value="#006847"
                                class="color-picker"
                            >

                        </div>


                        <!-- Rojo -->
                        <label class="form-label">
                            Rojo:
                            <span id="greenRValue">0</span>
                        </label>

                        <input
                            type="range"
                            id="greenR"
                            min="0"
                            max="255"
                            value="0"
                            class="form-range"
                        >


                        <!-- Verde -->
                        <label class="form-label">
                            Verde:
                            <span id="greenGValue">104</span>
                        </label>

                        <input
                            type="range"
                            id="greenG"
                            min="0"
                            max="255"
                            value="104"
                            class="form-range"
                        >


                        <!-- Azul -->
                        <label class="form-label">
                            Azul:
                            <span id="greenBValue">71</span>
                        </label>

                        <input
                            type="range"
                            id="greenB"
                            min="0"
                            max="255"
                            value="71"
                            class="form-range"
                        >


                        <!-- HEX -->
                        <div class="hex-box mt-3">

                            HEX:
                            <strong id="greenHex">
                                #006847
                            </strong>

                        </div>

                    </div>

                </div>

            </div>


            <!-- COLOR ROJO -->
            <div class="col-md-6">

                <div class="card shadow-sm">

                    <div class="card-body">

                        <h3 class="text-center">
                            Color Rojo
                        </h3>

                        <!-- Selector -->
                        <div class="text-center my-3">

                            <input
                                type="color"
                                id="redPicker"
                                value="#CE1126"
                                class="color-picker"
                            >

                        </div>


                        <!-- Rojo -->
                        <label class="form-label">
                            Rojo:
                            <span id="redRValue">206</span>
                        </label>

                        <input
                            type="range"
                            id="redR"
                            min="0"
                            max="255"
                            value="206"
                            class="form-range"
                        >


                        <!-- Verde -->
                        <label class="form-label">
                            Verde:
                            <span id="redGValue">17</span>
                        </label>

                        <input
                            type="range"
                            id="redG"
                            min="0"
                            max="255"
                            value="17"
                            class="form-range"
                        >


                        <!-- Azul -->
                        <label class="form-label">
                            Azul:
                            <span id="redBValue">38</span>
                        </label>

                        <input
                            type="range"
                            id="redB"
                            min="0"
                            max="255"
                            value="38"
                            class="form-range"
                        >


                        <!-- HEX -->
                        <div class="hex-box mt-3">

                            HEX:
                            <strong id="redHex">
                                #CE1126
                            </strong>

                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- =========================
             INFORMACIÓN
        ========================== -->

        <div class="card shadow-sm mt-4">

            <div class="card-body text-center">

                <h3>Valores actuales</h3>

                <div class="row mt-3">

                    <div class="col-md-6">

                        <p>
                            <strong>Verde</strong>
                        </p>

                        <p id="greenInfo">
                            RGB(0, 104, 71) |
                            HEX #006847
                        </p>

                    </div>


                    <div class="col-md-6">

                        <p>
                            <strong>Rojo</strong>
                        </p>

                        <p id="redInfo">
                            RGB(206, 17, 38) |
                            HEX #CE1126
                        </p>

                    </div>

                </div>

            </div>

        </div>


        <!-- =========================
             BOTONES
        ========================== -->

        <div class="text-center mt-4">

            <button
                id="swapButton"
                class="btn btn-success me-2"
            >
                Intercambiar colores
            </button>

            <button
                id="resetButton"
                class="btn btn-secondary"
            >
                Restablecer
            </button>

        </div>

    </div>


    <!-- Archivo JavaScript -->
    <script src="script.js"></script>

</body>
</html>
